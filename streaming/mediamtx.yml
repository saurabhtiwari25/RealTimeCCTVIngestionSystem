

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    ips: []
    permissions:
      - action: api
      - action: read
      - action: publish

metrics: no

rtsp: yes
rtspDisable: no
protocols: [tcp, udp]
rtspAddress: :8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001

webrtc: yes
webrtcDisable: no
webrtcAddress: :8889
webrtcEncryption: no
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcHandshakeTimeout: 10s

hls: yes
hlsDisable: no
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentCount: 5
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

rtmp: no

paths:
  all_others:
